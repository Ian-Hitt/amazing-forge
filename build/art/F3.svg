<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 374" font-family="Montserrat, 'DejaVu Sans', sans-serif">
  <rect width="620" height="374" fill="#ffffff"/>
  <text x="20" y="36" font-size="27" font-weight="800" fill="#1a1a1a">THE STORY SPINE</text>
  <text x="20" y="60" font-size="15" fill="#6b6b6b">Two tracks race to the end — the first one filled decides the Story.</text>

  <!-- Hero Track -->
  <text x="20" y="98" font-size="15" font-weight="800" fill="#1a1a1a">HERO TRACK <tspan font-weight="500" fill="#6b6b6b">— fill 1 box per Milestone</tspan></text>
  <g>
    <rect x="20"  y="108" width="168" height="54" rx="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><text x="104" y="141" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Milestone 1</text>
    <rect x="206" y="108" width="168" height="54" rx="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><text x="290" y="141" font-size="15" font-weight="700" fill="#1a1a1a" text-anchor="middle">Milestone 2</text>
    <rect x="392" y="108" width="168" height="54" rx="7" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/>
    <text x="476" y="134" font-size="15" font-weight="800" fill="#ffffff" text-anchor="middle">CLIMAX</text>
    <text x="476" y="152" font-size="12" font-weight="600" fill="#ffffff" text-anchor="middle">= WIN</text>
  </g>

  <!-- Antagonist Track -->
  <text x="20" y="212" font-size="15" font-weight="800" fill="#1a1a1a">ANTAGONIST TRACK <tspan font-weight="500" fill="#6b6b6b">— the bad guys' race</tspan></text>
  <g font-size="20" font-weight="800" text-anchor="middle">
    <rect x="20"  y="222" width="100" height="54" rx="7" fill="#e6e6e6" stroke="#1a1a1a" stroke-width="2"/><text x="70"  y="257" fill="#1a1a1a">1</text>
    <rect x="140" y="222" width="100" height="54" rx="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><text x="190" y="257" fill="#1a1a1a">2</text>
    <rect x="260" y="222" width="100" height="54" rx="7" fill="#e6e6e6" stroke="#1a1a1a" stroke-width="2"/><text x="310" y="257" fill="#1a1a1a">3</text>
    <rect x="380" y="222" width="100" height="54" rx="7" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><text x="430" y="257" fill="#1a1a1a">4</text>
    <rect x="500" y="222" width="100" height="54" rx="7" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="2"/><text x="550" y="251" fill="#ffffff">5</text>
    <text x="550" y="268" font-size="10.5" font-weight="700" fill="#ffffff">WINS</text>
  </g>
  <text x="20" y="298" font-size="12.5" fill="#6b6b6b">Shaded (odd) boxes = <tspan font-weight="700" fill="#1a1a1a">Bad Guys Close In.</tspan> The last box = the antagonist wins the Story.</text>

  <text x="20" y="336" font-size="14" fill="#1a1a1a"><tspan font-weight="700">Advances on:</tspan> a Devil's Bargain · a Miss on doubles · a hero Out of Action.</text>
  <text x="20" y="360" font-size="13" fill="#6b6b6b">Shown: an Episode (3 &amp; 5 boxes). A Movie is longer — 6 &amp; 9.</text>
</svg>
