<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 620 470" font-family="Montserrat, 'DejaVu Sans', sans-serif">
  <rect width="620" height="470" fill="#ffffff"/>
  <text x="20" y="32" font-size="26" font-weight="800" fill="#1a1a1a">THE HERO SHEET</text>
  <text x="20" y="56" font-size="15" fill="#6b6b6b">Everything a hero is — on one page.</text>

  <!-- Concept -->
  <text x="20" y="104" font-size="15" font-weight="800" fill="#1a1a1a">CONCEPT</text>
  <line x1="150" y1="102" x2="600" y2="102" stroke="#1a1a1a" stroke-width="2"/>
  <text x="150" y="124" font-size="12.5" fill="#6b6b6b">One-line movie-poster pitch — who your hero is.</text>

  <!-- Stats -->
  <text x="20" y="180" font-size="15" font-weight="800" fill="#1a1a1a">STATS</text>
  <g font-size="13" font-weight="700" text-anchor="middle">
    <rect x="150" y="160" width="84" height="28" rx="14" fill="#1a1a1a"/><text x="192" y="179" fill="#ffffff">Strong</text>
    <rect x="242" y="160" width="84" height="28" rx="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><text x="284" y="179" fill="#1a1a1a">Quick</text>
    <rect x="334" y="160" width="84" height="28" rx="14" fill="#1a1a1a"/><text x="376" y="179" fill="#ffffff">Clever</text>
    <rect x="426" y="160" width="84" height="28" rx="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><text x="468" y="179" fill="#1a1a1a">Sneaky</text>
    <rect x="518" y="160" width="84" height="28" rx="14" fill="#ffffff" stroke="#1a1a1a" stroke-width="2"/><text x="560" y="179" fill="#1a1a1a">Charming</text>
  </g>
  <text x="150" y="206" font-size="12.5" fill="#6b6b6b">Pick two (filled) → +1 when the moment calls for one.</text>

  <!-- Assets -->
  <text x="20" y="256" font-size="15" font-weight="800" fill="#1a1a1a">ASSETS</text>
  <g font-size="12.5" font-weight="700" text-anchor="middle" fill="#1a1a1a">
    <rect x="150" y="234" width="144" height="36" rx="6" fill="#f3f0ec" stroke="#1a1a1a" stroke-width="2"/><text x="222" y="257">Skill / expertise</text>
    <rect x="302" y="234" width="144" height="36" rx="6" fill="#f3f0ec" stroke="#1a1a1a" stroke-width="2"/><text x="374" y="257">Item · ally · tie</text>
    <rect x="454" y="234" width="144" height="36" rx="6" fill="#f3f0ec" stroke="#1a1a1a" stroke-width="2"/><text x="526" y="257">Their other side</text>
  </g>
  <text x="150" y="290" font-size="12.5" fill="#6b6b6b">Three things you shine at → +1 when one fits (you make the case).</text>

  <!-- Readiness -->
  <text x="20" y="338" font-size="15" font-weight="800" fill="#1a1a1a">READINESS</text>
  <g font-size="11" font-weight="700" text-anchor="middle">
    <rect x="150" y="316" width="38" height="30" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="169" y="336" fill="#1a1a1a">0</text>
    <rect x="195" y="316" width="38" height="30" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="214" y="336" fill="#1a1a1a">1</text>
    <rect x="240" y="316" width="38" height="30" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="259" y="336" fill="#1a1a1a">2</text>
    <rect x="285" y="316" width="38" height="30" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="304" y="336" fill="#1a1a1a">3</text>
    <rect x="330" y="316" width="38" height="30" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="349" y="336" fill="#1a1a1a">4</text>
    <rect x="375" y="316" width="38" height="30" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="394" y="336" fill="#1a1a1a">5</text>
    <rect x="420" y="316" width="38" height="30" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="439" y="336" fill="#1a1a1a">6</text>
    <rect x="465" y="316" width="38" height="30" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="484" y="336" fill="#1a1a1a">7</text>
    <rect x="510" y="316" width="38" height="30" rx="4" fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8"/><text x="529" y="336" fill="#1a1a1a">8</text>
    <rect x="555" y="316" width="38" height="30" rx="4" fill="#1a1a1a" stroke="#1a1a1a" stroke-width="1.8"/><text x="574" y="336" fill="#ffffff">9</text>
  </g>
  <text x="150" y="366" font-size="12.5" fill="#6b6b6b">Health bar. Start 9. Weak −1 / Miss −2; regroup to refill.</text>

  <!-- Growth -->
  <text x="20" y="414" font-size="15" font-weight="800" fill="#1a1a1a">GROWTH</text>
  <g fill="#ffffff" stroke="#1a1a1a" stroke-width="1.8">
    <rect x="150" y="392" width="40" height="28" rx="4"/><rect x="200" y="392" width="40" height="28" rx="4"/><rect x="250" y="392" width="40" height="28" rx="4"/>
    <rect x="300" y="392" width="40" height="28" rx="4"/><rect x="350" y="392" width="40" height="28" rx="4"/><rect x="400" y="392" width="40" height="28" rx="4"/>
    <rect x="450" y="392" width="40" height="28" rx="4"/><rect x="500" y="392" width="40" height="28" rx="4"/><rect x="550" y="392" width="40" height="28" rx="4"/>
  </g>
  <text x="150" y="440" font-size="12.5" fill="#6b6b6b">1 per 3 Milestones → spend on Boons (2) or a new Asset (5).</text>
</svg>
