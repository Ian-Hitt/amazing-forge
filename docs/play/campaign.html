<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Campaign Tracker — Lights, Camera, Action!</title>
<style>
  :root {
    --orange: #d35400; --orange-dark: #b8490a;
    --ink: #1c1a18; --paper: #fbf8f3; --card: #ffffff; --line: #d8cfc4; --muted: #6f665d;
    --good: #2e7d32; --bad: #c0392b;
    --shadow: 0 1px 2px rgba(0,0,0,.06), 0 4px 16px rgba(0,0,0,.06);
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --ink: #ece7e1; --paper: #15130f; --card: #211d18; --line: #3a342c; --muted: #a59a8d;
      --shadow: 0 1px 2px rgba(0,0,0,.3), 0 4px 18px rgba(0,0,0,.35);
    }
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    color: var(--ink); background: var(--paper); line-height: 1.5; -webkit-text-size-adjust: 100%;
  }
  a { color: var(--orange); }

  /* ---- slim header ---- */
  .topbar {
    position: sticky; top: 0; z-index: 30; background: var(--paper);
    border-bottom: 1px solid var(--line); padding: .4rem .6rem;
    display: flex; align-items: center; gap: .35rem;
  }
  .topbar .camp-name { flex: 1; min-width: 0; font-size: 1.05rem; font-weight: 800; border: none;
    background: transparent; color: var(--ink); padding: .25rem .1rem; text-overflow: ellipsis; }
  .topbar .camp-name:focus { outline: none; }
  .iconbtn { border: none; background: transparent; color: var(--ink); font-size: 1.2rem; line-height: 1;
    padding: .4rem .55rem; cursor: pointer; border-radius: 8px; }
  .iconbtn:hover { background: rgba(127,127,127,.14); }
  .dot { width: .7rem; height: .7rem; border-radius: 50%; flex: 0 0 auto; display: inline-block; }
  .iconbtn svg { width: 1.45rem; height: 1.45rem; display: block; }
  .ico { display: inline-flex; align-items: center; justify-content: center; }
  .ico svg { width: 1.3rem; height: 1.3rem; }
  button.icon svg { width: 1.1rem; height: 1.1rem; display: block; }
  select, .num-input { font: inherit; padding: .38rem .55rem; border-radius: 7px; border: 1px solid var(--line); background: var(--card); color: var(--ink); }
  select { max-width: 42vw; }
  button {
    font: inherit; font-weight: 700; cursor: pointer; border-radius: 7px;
    border: 1.5px solid var(--orange); background: var(--orange); color: #fff;
    padding: .42rem .8rem; transition: background .12s, border-color .12s, opacity .12s; white-space: nowrap;
  }
  button:hover { background: var(--orange-dark); border-color: var(--orange-dark); }
  button.ghost { background: transparent; color: var(--orange); }
  button.ghost:hover { background: rgba(211,84,0,.08); }
  button.danger { border-color: var(--bad); background: transparent; color: var(--bad); }
  button.danger:hover { background: rgba(192,57,43,.1); }
  button.sm { padding: .25rem .55rem; font-size: .82rem; border-radius: 6px; }
  button.icon { padding: .25rem .5rem; font-size: .9rem; }

  .wrap { max-width: 820px; margin: 0 auto; padding: .8rem 1rem 3rem; }
  .page-title { font-size: 1.25rem; font-weight: 800; margin: .1rem 0 .8rem; }

  /* ---- slide-in nav drawer ---- */
  .drawer-overlay { position: fixed; inset: 0; z-index: 50; background: rgba(0,0,0,.45);
    opacity: 0; pointer-events: none; transition: opacity .2s; }
  .drawer-overlay.show { opacity: 1; pointer-events: auto; }
  .drawer { position: fixed; top: 0; left: 0; bottom: 0; z-index: 51; width: 82vw; max-width: 300px;
    background: var(--paper); border-right: 1px solid var(--line); box-shadow: 6px 0 30px rgba(0,0,0,.28);
    transform: translateX(-102%); transition: transform .24s ease; display: flex; flex-direction: column;
    padding: .5rem .45rem calc(.6rem + env(safe-area-inset-bottom, 0px)); overflow-y: auto; }
  .drawer.show { transform: translateX(0); }
  .drawer .dtitle { font-weight: 800; font-size: 1rem; padding: .5rem .55rem .3rem; display: flex; align-items: center; }
  .drawer .dtitle .x { margin-left: auto; }
  .drawer .dhead { font-weight: 700; font-size: .64rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); padding: .85rem .7rem .25rem; }
  .navitem { display: flex; align-items: center; gap: .7rem; width: 100%; border: none; background: transparent;
    color: var(--ink); cursor: pointer; border-radius: 10px; padding: .68rem .7rem; font: inherit; font-weight: 700; text-align: left; }
  .navitem:hover { background: rgba(127,127,127,.12); }
  .navitem.on { background: var(--orange); color: #fff; }
  .navitem .ico { font-size: 1.2rem; width: 1.6rem; text-align: center; flex: 0 0 auto; }
  .navitem .lbl { flex: 1; }
  .navitem .badge { font-size: .82rem; font-weight: 700; opacity: .6; }
  .navitem.on .badge { opacity: .9; }

  /* ---- manage page ---- */
  .mblock { background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; padding: 1rem 1.1rem; margin: .85rem 0; }
  .mblock h3 { margin: 0 0 .55rem; font-size: .95rem; border-bottom: 2px solid var(--orange); padding-bottom: .22rem; }
  .mblock .row { display: flex; gap: .5rem; flex-wrap: wrap; align-items: center; }
  .mblock .row button { flex: 1 1 auto; }
  .mblock select { width: 100%; max-width: none; margin-bottom: .55rem; }
  .mblock .status { font-size: .92rem; font-weight: 700; margin-bottom: .5rem; display: flex; align-items: center; gap: .4rem; }
  .mblock .status b { color: var(--orange); }
  button:disabled { opacity: .45; cursor: not-allowed; }

  /* ---- cards ---- */
  .card {
    background: var(--card); border: 1.5px solid var(--line); border-radius: 12px;
    box-shadow: var(--shadow); padding: 1rem 1.1rem; margin: .85rem 0;
  }
  .card.accent { border-color: var(--orange); border-width: 2px; }
  .card-head { display: flex; align-items: center; gap: .6rem; flex-wrap: wrap; }
  .card-head .title { font-weight: 800; font-size: 1.05rem; flex: 1; min-width: 140px; }
  .card-head .title .dim { color: var(--muted); font-weight: 600; font-size: .9rem; }
  .card-head .actions { display: flex; gap: .35rem; }

  h2.sec { font-size: .95rem; margin: 1.1rem 0 .45rem; padding-bottom: .22rem; border-bottom: 2px solid var(--orange); letter-spacing: .02em; }
  .hint { font-size: .8rem; color: var(--muted); font-style: italic; margin: .1rem 0 .55rem; }
  label.fld { display: block; font-weight: 700; font-size: .8rem; margin-bottom: .2rem; }
  input[type=text], textarea {
    font: inherit; width: 100%; color: var(--ink); background: transparent;
    border: none; border-bottom: 1.5px solid var(--line); padding: .32rem .1rem; border-radius: 0;
  }
  input[type=text]:focus, textarea:focus { outline: none; border-bottom-color: var(--orange); }
  textarea { border: 1.5px solid var(--line); border-radius: 8px; padding: .5rem .6rem; min-height: 4rem; resize: vertical; }
  textarea:focus { border-color: var(--orange); }
  .row { display: flex; gap: 1rem; flex-wrap: wrap; }
  .row > div { flex: 1; min-width: 170px; }

  /* chips (stats) */
  .chips { display: flex; flex-wrap: wrap; gap: .45rem; }
  .chip { border: 1.5px solid var(--line); background: var(--card); color: var(--ink);
    border-radius: 999px; padding: .3rem .85rem; font-weight: 700; font-size: .85rem; cursor: pointer; user-select: none; transition: all .12s; }
  .chip:hover { border-color: var(--orange); }
  .chip.on { background: var(--orange); border-color: var(--orange); color: #fff; }
  .chip.lock { opacity: .42; cursor: not-allowed; }
  .chip.lock:hover { border-color: var(--line); }

  /* assets */
  .asset { border: 1px solid var(--line); border-radius: 10px; padding: .6rem .7rem; margin: .5rem 0; }
  .asset .kind { font-size: .68rem; font-weight: 700; text-transform: uppercase; letter-spacing: .07em; color: var(--muted); }
  .asset.broken { opacity: .6; border-style: dashed; }
  .boons { margin-top: .45rem; display: grid; gap: .3rem; }
  .boon { display: flex; align-items: center; gap: .4rem; }
  .boon .bx { font-size: .68rem; color: var(--muted); white-space: nowrap; }
  .asset-foot { display: flex; align-items: center; gap: .4rem; margin-top: .45rem; font-size: .78rem; color: var(--muted); }
  .asset-foot input { width: 1rem; height: 1rem; accent-color: var(--bad); }

  /* tracks */
  .track { display: flex; flex-wrap: wrap; gap: .3rem; align-items: center; }
  .box { width: 1.9rem; height: 1.9rem; border: 1.5px solid var(--line); border-radius: 6px;
    display: inline-flex; align-items: center; justify-content: center; font-size: .7rem; font-weight: 700;
    cursor: pointer; user-select: none; color: var(--muted); background: var(--card); transition: all .1s; flex: 0 0 auto; }
  .box:hover { border-color: var(--orange); }
  .rdy .box.fill { background: var(--good); border-color: var(--good); color: #fff; }
  .rdy .box.start { border-color: var(--orange); border-width: 2.5px; }
  .grow .box.fill { background: var(--orange); border-color: var(--orange); color: #fff; }
  .arc .box.fill { background: var(--good); border-color: var(--good); color: #fff; }
  .arc .box { border-color: #6aa56d; }
  .anta .box { border-color: #cf7a72; }
  .anta .box.fill { background: var(--bad); border-color: var(--bad); color: #fff; }
  .anta .box.climax { border-width: 2.5px; }
  .anta .box.closein { border-width: 2px; color: var(--bad); }
  .chal .box.fill { background: var(--orange); border-color: var(--orange); color: #fff; }
  .readout { font-weight: 800; font-size: .95rem; margin-left: .15rem; }
  .readout small { font-weight: 600; color: var(--muted); }
  .tracklabel { font-weight: 700; font-size: .78rem; width: 5.4rem; flex: 0 0 auto; color: var(--muted); }
  .trackrow { display: flex; align-items: center; gap: .5rem; margin: .35rem 0; flex-wrap: wrap; }

  /* milestones */
  .ms { display: flex; align-items: center; gap: .5rem; margin: .3rem 0; }
  .ms .mschk { width: 1.15rem; height: 1.15rem; flex: 0 0 auto; accent-color: var(--good); }
  .ms .num { font-weight: 700; color: var(--muted); width: 1.2rem; flex: 0 0 auto; }
  .ms input[type=text] { flex: 1; }
  .ms.done input[type=text] { text-decoration: line-through; opacity: .6; }

  /* banner / toast / empty */
  .banner { border: 1.5px solid var(--orange); background: rgba(211,84,0,.08); border-radius: 9px;
    padding: .7rem .9rem; margin-bottom: 1rem; display: flex; gap: .7rem; align-items: center; flex-wrap: wrap; }
  .banner.hidden { display: none; }
  .banner p { margin: 0; flex: 1; min-width: 220px; font-size: .88rem; }
  .empty { text-align: center; color: var(--muted); padding: 2.5rem 1rem; }
  .empty h3 { color: var(--ink); }
  .toast { position: fixed; left: 50%; bottom: 1.4rem; transform: translateX(-50%) translateY(2rem);
    background: var(--ink); color: var(--paper); padding: .6rem 1.1rem; border-radius: 999px;
    font-size: .88rem; font-weight: 600; opacity: 0; pointer-events: none; transition: all .25s; z-index: 60; max-width: 90vw; }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  .ref { font-size: .78rem; color: var(--muted); border-top: 1px dashed var(--line); margin-top: 1rem; padding-top: .6rem; }
  .ref b { color: var(--orange); }
  .footnote { text-align: center; font-size: .8rem; color: var(--muted); margin-top: 1.6rem; }
  .sizepick { display: flex; gap: .4rem; flex-wrap: wrap; align-items: center; }

  /* ---- dashboard ---- */
  .wrap.wide { max-width: none; padding-left: 1.25rem; padding-right: 1.25rem; }
  /* One tile grid: hero cards are single tiles, wider widgets span two columns.
     dense flow lets the tables/challenges rise into the gap beside a few heroes. */
  .dash { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr));
    grid-auto-flow: row dense; gap: .8rem; align-items: start; }
  .dash > .w { grid-column: span 2; }
  .dash > .hc { grid-column: span 1; box-shadow: var(--shadow); border-width: 1.5px; border-radius: 12px; padding: .7rem .8rem; }
  .dash .w { background: var(--card); border: 1.5px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: .7rem .85rem; min-width: 0; }
  .dash .w > h3 { margin: 0 0 .55rem; font-size: .68rem; text-transform: uppercase; letter-spacing: .09em; color: var(--muted);
    border-bottom: 1px solid var(--line); padding-bottom: .32rem; display: flex; align-items: center; justify-content: space-between; }
  .dash .w.click { cursor: pointer; transition: border-color .12s; }
  .dash .w.click:hover { border-color: var(--orange); }
  .dash .wlink { font-size: .7rem; color: var(--orange); font-weight: 800; letter-spacing: 0; text-transform: none; }
  .dash .scroll { max-height: 22rem; overflow: auto; margin: -.1rem; padding: .1rem; }
  .dash-empty { color: var(--muted); font-size: .82rem; font-style: italic; padding: .3rem 0; }
  .create-wrap { position: relative; flex: 0 0 auto; }
  .create-menu { position: absolute; right: 0; top: calc(100% + 6px); z-index: 60; background: var(--card);
    border: 1.5px solid var(--line); border-radius: 12px; box-shadow: var(--shadow); padding: .35rem; min-width: 12.5rem;
    display: flex; flex-direction: column; gap: 2px; }
  .create-menu button { display: flex; align-items: center; gap: .55rem; width: 100%; text-align: left; background: none;
    border: none; border-radius: 8px; padding: .5rem .6rem; font: inherit; font-size: .9rem; color: var(--ink); cursor: pointer; }
  .create-menu button:hover { background: var(--line); border-color: var(--line); }
  .create-menu .ci { width: 1.5rem; flex: 0 0 auto; text-align: center; font-size: 1.05rem; }
  .create-back { position: fixed; inset: 0; z-index: 55; background: transparent; }

  .mbar { flex: 1; height: .5rem; border-radius: 999px; background: var(--line); overflow: hidden; min-width: 44px; }
  .mbar > i { display: block; height: 100%; border-radius: 999px; }

  .heroes-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(184px, 100%), 1fr)); gap: .6rem; }
  .hc { border: 1px solid var(--line); border-radius: 10px; padding: .55rem .6rem; cursor: pointer; background: var(--card); min-width: 0; transition: border-color .12s; }
  .hc:hover { border-color: var(--orange); }
  .hc .hc-top { display: flex; align-items: center; gap: .45rem; }
  .hc .hc-av { width: 46px; height: 46px; border-radius: 9px; object-fit: cover; flex: 0 0 auto; }
  .hc .hc-name { font-weight: 800; font-size: .9rem; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hc .hc-con { color: var(--muted); font-size: .73rem; margin: .2rem 0 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .hc .hc-stats { font-size: .72rem; font-weight: 700; margin-top: .3rem; }
  .hc .hc-rdy { display: flex; align-items: center; gap: .35rem; margin-top: .35rem; }
  .hc .hc-rdy small { font-size: .68rem; font-weight: 700; color: var(--muted); flex: 0 0 auto; }
  .hc .hc-assets { font-size: .71rem; color: var(--muted); margin-top: .35rem; line-height: 1.4; }
  .hc .hc-assets s { opacity: .7; }

  .dtable { width: 100%; border-collapse: collapse; font-size: .82rem; }
  .dtable th { text-align: left; font-size: .62rem; text-transform: uppercase; letter-spacing: .06em; color: var(--muted);
    font-weight: 700; padding: .25rem .35rem; border-bottom: 1px solid var(--line); position: sticky; top: 0; background: var(--card); }
  .dtable td { padding: .34rem .35rem; border-bottom: 1px solid var(--line); vertical-align: top; }
  .dtable tbody tr:last-child td { border-bottom: none; }
  .dtable tbody tr { cursor: pointer; }
  .dtable tbody tr:hover { background: rgba(127,127,127,.08); }
  .dtable .nm { font-weight: 700; }
  .dtable .sub { color: var(--muted); }
  .dtable .st { color: var(--orange); }

  @media (max-width: 700px) { .dash { grid-template-columns: 1fr; } .dash > .w, .dash > .hc { grid-column: auto; } }

  /* ---- gallery ---- */
  .gallery { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 160px), 1fr)); gap: .7rem; margin: .3rem 0 1rem; }
  .gtile { cursor: zoom-in; border: 1.5px solid var(--line); border-radius: 12px; overflow: hidden; background: var(--card); box-shadow: var(--shadow); transition: border-color .12s; }
  .gtile:hover { border-color: var(--orange); }
  .gimg { width: 100%; aspect-ratio: 1 / 1; background: center/cover no-repeat var(--line); }
  .gcap { padding: .45rem .55rem; display: flex; flex-direction: column; gap: .1rem; min-width: 0; }
  .gcap b { font-size: .82rem; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .gcap span { font-size: .72rem; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  @media print {
    .topbar, .drawer, .drawer-overlay, .banner, .toast, .footnote, .no-print { display: none !important; }
    body { background: #fff; color: #000; }
    .wrap { max-width: none; padding: 0; }
    .card { border-color: #999; box-shadow: none; break-inside: avoid; page-break-inside: avoid; }
    .box { cursor: default; }
    .print-all > * { display: block !important; }
  }
</style>
</head>
<body>

<header class="topbar">
  <button id="menuBtn" class="iconbtn" aria-label="Open menu" title="Menu">&#9776;</button>
  <input id="campName" class="camp-name" type="text" placeholder="Campaign" aria-label="Campaign name" autocomplete="off">
  <span id="syncDot" class="dot" title=""></span>
  <div id="createWrap" class="create-wrap"></div>
</header>

<main class="wrap" id="app"></main>

<div class="drawer-overlay" id="drawerOverlay"></div>
<aside class="drawer" id="drawer"></aside>
<div class="toast" id="toast"></div>

<script>
(function () {
  "use strict";

  var STATS = ["Strong", "Quick", "Clever", "Sneaky", "Charming"];
  var ASSET_KINDS = ["Skill or Expertise", "Item, Companion, or Connection", "Wild (your call)"];
  var LS_CAMPS = "lca_campaigns_v1";
  var LS_ACTIVE = "lca_active_campaign_v1";
  var SIZES = { episode: { label: "Episode", ms: 3, anta: 5 }, movie: { label: "Movie", ms: 6, anta: 9 } };

  // ---------- helpers ----------
  var $ = function (id) { return document.getElementById(id); };
  function uid(p) { return (p || "x") + Math.random().toString(36).slice(2, 8) + Date.now().toString(36).slice(-3); }
  function nowTs() { return Date.now(); }
  function clamp(v, lo, hi, dflt) { v = parseInt(v, 10); if (isNaN(v)) return dflt; return Math.max(lo, Math.min(hi, v)); }
  function el(tag, cls, txt) { var e = document.createElement(tag); if (cls) e.className = cls; if (txt != null) e.textContent = txt; return e; }
  function esc(s) { return (s || "").replace(/[&<>]/g, function (c) { return { "&": "&amp;", "<": "&lt;", ">": "&gt;" }[c]; }); }

  // ---------- inline icons (Lucide, MIT-licensed) ----------
  var ICONS = {
    menu: '<line x1="4" x2="20" y1="6" y2="6"/><line x1="4" x2="20" y1="12" y2="12"/><line x1="4" x2="20" y1="18" y2="18"/>',
    grid: '<rect width="7" height="9" x="3" y="3" rx="1"/><rect width="7" height="5" x="14" y="3" rx="1"/><rect width="7" height="9" x="14" y="12" rx="1"/><rect width="7" height="5" x="3" y="16" rx="1"/>',
    image: '<rect width="18" height="18" x="3" y="3" rx="2" ry="2"/><circle cx="9" cy="9" r="2"/><path d="m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21"/>',
    x: '<path d="M18 6 6 18"/><path d="m6 6 12 12"/>',
    users: '<path d="M16 21v-2a4 4 0 0 0-4-4H6a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M22 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/>',
    userRound: '<circle cx="12" cy="8" r="5"/><path d="M20 21a8 8 0 0 0-16 0"/>',
    film: '<rect width="18" height="18" x="3" y="3" rx="2"/><path d="M7 3v18"/><path d="M3 7.5h4"/><path d="M3 12h18"/><path d="M3 16.5h4"/><path d="M17 3v18"/><path d="M17 7.5h4"/><path d="M17 16.5h4"/>',
    target: '<circle cx="12" cy="12" r="10"/><circle cx="12" cy="12" r="6"/><circle cx="12" cy="12" r="2"/>',
    globe: '<circle cx="12" cy="12" r="10"/><path d="M12 2a14.5 14.5 0 0 0 0 20 14.5 14.5 0 0 0 0-20"/><path d="M2 12h20"/>',
    pin: '<path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/>',
    settings: '<path d="M20 7h-9"/><path d="M14 17H5"/><circle cx="17" cy="17" r="3"/><circle cx="7" cy="7" r="3"/>',
    star: '<polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/>'
  };
  function icon(name, fill) {
    return '<svg viewBox="0 0 24 24" fill="' + (fill || "none") + '" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">' + (ICONS[name] || "") + "</svg>";
  }
  function delBtn() { var b = el("button", "danger sm icon"); b.innerHTML = icon("x"); return b; }

  // ---------- model ----------
  function blankHero() {
    return { id: uid("h"), name: "", player: "", concept: "", notes: "", stats: [], img: "",
      assets: [ { name: "", boons: ["", ""], broken: false }, { name: "", boons: ["", ""], broken: false }, { name: "", boons: ["", ""], broken: false } ],
      rdy: 9, grow: 0 };

    g.cast = content.e.map(function (n) { var x = blankNpc(); if (n.i) x.id = n.i; x.name = n.n || ""; x.star = !!n.s; x.role = n.r || ""; x.detail = n.d || ""; x.lastSeen = n.l || ""; x.img = n.im || ""; return x; });

  // ---------- shared field binder (no re-render on keystroke) ----------
  function textField(obj, key, placeholder, onAfter) {
    var i = el("input"); i.type = "text"; i.placeholder = placeholder || ""; i.value = obj[key] || "";
    i.oninput = function () { obj[key] = i.value; persist(); if (onAfter) onAfter(); };
    return i;
  }
  function labeled(labelTxt, node) { var d = el("div"); d.appendChild(el("label", "fld", labelTxt)); d.appendChild(node); return d; }

  // ---------- image upload (thumbnail -> R2 via the worker) ----------
  // Downscale on a canvas first: keeps uploads to ~30–60 KB, so only a short URL ever
  // travels through the synced campaign JSON.
  function downscaleImage(file, maxDim, cb) {
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function () {
      var scale = Math.min(1, maxDim / Math.max(img.width, img.height));
      var cw = Math.max(1, Math.round(img.width * scale)), chh = Math.max(1, Math.round(img.height * scale));
      var cv = el("canvas"); cv.width = cw; cv.height = chh;
      cv.getContext("2d").drawImage(img, 0, 0, cw, chh);
      URL.revokeObjectURL(url);
      cv.toBlob(function (blob) { cb(blob); }, "image/jpeg", 0.82);
    };
    img.onerror = function () { URL.revokeObjectURL(url); cb(null); };
    img.src = url;
  }

  // Every photo in the campaign, grouped hero → cast → location (stable order so a
  // gallery index lines up with the flat list the lightbox pages through).
  function allImages() {
    var out = [];
    (camp && camp.heroes || []).forEach(function (h) { if (h.img) out.push({ url: h.img, label: h.name || "Unnamed hero", sub: h.concept || "Hero", type: "hero" }); });
    (camp && camp.cast || []).forEach(function (n) { if (n.img) out.push({ url: n.img, label: n.name || "Unnamed", sub: n.role || "Cast", type: "npc" }); });
    (camp && camp.places || []).forEach(function (p) { if (p.img) out.push({ url: p.img, label: p.name || "Unnamed", sub: p.fn || "Location", type: "location" }); });
    return out;
  }
  // Open the lightbox on a given image, browsing the whole campaign gallery around it.
  function viewImage(url) {
    var g = allImages(), i = 0;
    for (var k = 0; k < g.length; k++) { if (g[k].url === url) { i = k; break; } }
    openLightbox(g.length ? g : [{ url: url }], i);
  }
  function lbNavBtn(txt, on) {
    var b = el("button"); b.textContent = txt;
    b.style.cssText = "flex:0 0 auto;background:rgba(255,255,255,.14);color:#fff;border:none;border-radius:50%;width:2.6rem;height:2.6rem;padding:0;font-size:1.7rem;line-height:1;cursor:pointer;";
    b.onclick = function (ev) { ev.stopPropagation(); on(); };
    return b;
  }
  // Full-size image viewer with prev/next + a thumbnail strip. Click backdrop or Esc to close;
  // arrow keys page through. Accepts a single url string or a list of { url, label, sub }.
  function openLightbox(items, index) {
    if (typeof items === "string") items = [{ url: items }];
    items = (items || []).filter(function (x) { return x && x.url; });
    if (!items.length) return;
    var idx = index || 0, multi = items.length > 1;

    var ov = el("div");
    ov.style.cssText = "position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.87);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1rem;padding:1.4rem;";
    function close() { if (ov.parentNode) ov.parentNode.removeChild(ov); document.removeEventListener("keydown", onKey); }
    function onKey(e) { if (e.key === "Escape") close(); else if (multi && e.key === "ArrowRight") show(idx + 1); else if (multi && e.key === "ArrowLeft") show(idx - 1); }
    ov.onclick = close;

    var x = el("button"); x.innerHTML = icon("x"); x.title = "Close (Esc)";
    x.style.cssText = "position:absolute;top:1rem;right:1rem;color:#fff;background:rgba(255,255,255,.14);border:none;border-radius:8px;width:2.4rem;height:2.4rem;padding:.4rem;cursor:pointer;";
    x.onclick = function (ev) { ev.stopPropagation(); close(); };
    ov.appendChild(x);

    var stage = el("div"); stage.style.cssText = "display:flex;align-items:center;gap:1rem;max-width:100%;flex:1;min-height:0;";
    var center = el("div"); center.style.cssText = "display:flex;flex-direction:column;align-items:center;gap:.6rem;min-width:0;min-height:0;";
    center.onclick = function (ev) { ev.stopPropagation(); };
    var big = el("img"); big.style.cssText = "max-width:78vw;max-height:70vh;border-radius:10px;box-shadow:0 8px 40px rgba(0,0,0,.5);object-fit:contain;";
    var cap = el("div"); cap.style.cssText = "color:#fff;text-align:center;font-size:.95rem;";
    center.appendChild(big); center.appendChild(cap);
    var prev = lbNavBtn("‹", function () { show(idx - 1); }), next = lbNavBtn("›", function () { show(idx + 1); });
    if (multi) stage.appendChild(prev);
    stage.appendChild(center);
    if (multi) stage.appendChild(next);
    ov.appendChild(stage);

    var thumbs = [];
    if (multi) {
      var strip = el("div"); strip.style.cssText = "display:flex;gap:.5rem;max-width:94vw;overflow-x:auto;padding:.3rem;flex:0 0 auto;";
      strip.onclick = function (ev) { ev.stopPropagation(); };
      items.forEach(function (it, i) {
        var th = el("div");
        th.style.cssText = "width:54px;height:54px;flex:0 0 auto;border-radius:7px;background:center/cover no-repeat;background-image:url('" + it.url + "');cursor:pointer;border:2px solid transparent;opacity:.55;transition:opacity .12s,border-color .12s;";
        th.title = it.label || ""; th.onclick = function () { show(i); };
        strip.appendChild(th); thumbs.push(th);
      });
      ov.appendChild(strip);
    }

    function show(i) {
      idx = (i + items.length) % items.length;
      var it = items[idx];
      big.src = it.url;
      cap.innerHTML = "<b>" + esc(it.label || "") + "</b>" + (it.sub ? ' <span style="color:#bbb">— ' + esc(it.sub) + "</span>" : "") + (multi ? ' <span style="color:#888">(' + (idx + 1) + "/" + items.length + ")</span>" : "");
      thumbs.forEach(function (th, j) { th.style.opacity = j === idx ? "1" : ".55"; th.style.borderColor = j === idx ? "var(--orange)" : "transparent"; });
      if (thumbs[idx] && thumbs[idx].scrollIntoView) thumbs[idx].scrollIntoView({ block: "nearest", inline: "center" });
    }
    show(idx);
    document.addEventListener("keydown", onKey);
    document.body.appendChild(ov);
  }

  // A photo control: thumbnail + Add/Change/Remove. Sets obj.img to the returned URL.
  function imageField(obj) {
    var wrap = el("div"); wrap.style.cssText = "display:flex;align-items:center;gap:.7rem;margin:.2rem 0 .1rem;";
    var thumb = el("div");
    thumb.style.cssText = "width:64px;height:64px;flex:0 0 auto;border-radius:10px;border:1px solid var(--line);background:var(--card) center/cover no-repeat;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:.66rem;overflow:hidden;";
    if (obj.img) { thumb.style.backgroundImage = "url('" + obj.img + "')"; thumb.style.cursor = "zoom-in"; thumb.title = "View photo"; thumb.onclick = function () { viewImage(obj.img); }; }
    else thumb.textContent = "No photo";
    var btns = el("div"); btns.style.cssText = "display:flex;gap:.4rem;flex-wrap:wrap;";
    var file = el("input"); file.type = "file"; file.accept = "image/*"; file.style.display = "none";
    var pick = el("button", "ghost sm", obj.img ? "Change photo" : "Add photo");
    pick.onclick = function () { file.click(); };
    btns.appendChild(pick);
    if (obj.img) { var rm = el("button", "ghost sm", "Remove"); rm.onclick = function () { obj.img = ""; persist(); render(); }; btns.appendChild(rm); }
    file.onchange = function () {
      var f = file.files && file.files[0]; if (!f) return;
      pick.disabled = true; pick.textContent = "Uploading…";
      downscaleImage(f, 512, function (blob) {
        if (!blob) { pick.disabled = false; pick.textContent = obj.img ? "Change photo" : "Add photo"; toast("Couldn't read that image."); return; }
        fetch(WORKER_URL + "/img", { method: "POST", headers: { "Content-Type": "image/jpeg" }, body: blob })
          .then(function (r) { return r.ok ? r.json() : null; })
          .then(function (d) { if (!d || !d.url) throw new Error("upload"); obj.img = d.url; persist(); render(); })
          .catch(function () { pick.disabled = false; pick.textContent = obj.img ? "Change photo" : "Add photo"; toast("Upload failed — check your connection."); });
      });
    };
    wrap.appendChild(thumb); wrap.appendChild(btns); wrap.appendChild(file);
    return wrap;
  }

  // ============================================================ DASHBOARD
  // A read-only, at-a-glance overview: the Story Arc, hero cards, and compact Cast /
  // Locations tables. Everything is a shortcut — tap through to the full editor.
  function jump(tab, openHeroId) { ui.tab = tab; ui.openHero = openHeroId || null; render(); try { window.scrollTo(0, 0); } catch (e) {} }

  // An interactive segmented track: click a segment to set the value (click the current
  // top segment to step down one, matching the editors). stopPropagation keeps the click
  // from also firing an enclosing card/widget navigation.
  function segTrack(cur, max, color, onSet, opts) {
    opts = opts || {};
    var seg = el("div"); seg.style.cssText = "display:flex;gap:2px;flex:1;min-width:0;";
    for (var i = 1; i <= max; i++) {
      (function (n) {
        var s = el("div");
        s.style.cssText = "flex:1;height:" + (opts.h || "1rem") + ";min-width:3px;border-radius:3px;cursor:pointer;background:" + (n <= cur ? color : "var(--line)") + ";transition:background .1s;";
        s.title = "Set to " + n + " / " + max;
        s.onclick = function (ev) { ev.stopPropagation(); onSet(cur === n ? n - 1 : n); };
        seg.appendChild(s);
      })(i);
    }
    return seg;
  }
  function dashEmpty(msg) { return el("div", "dash-empty", msg); }
  // A square thumbnail for table rows; a soft aligned slot when there's no image.
  // Imaged thumbnails open the lightbox on click (without triggering the row's navigation).
  function dashThumb(img, size) {
    size = size || 44;
    var t = el("div");
    t.style.cssText = "width:" + size + "px;height:" + size + "px;flex:0 0 auto;border-radius:8px;overflow:hidden;background:center/cover no-repeat;" +
      (img ? "background-image:url('" + img + "');border:1px solid var(--line);cursor:zoom-in;" : "background:var(--line);opacity:.35;");
    if (img) { t.title = "View photo"; t.onclick = function (ev) { ev.stopPropagation(); viewImage(img); }; }
    return t;
  }
  // Name cell contents: thumbnail + (optional prefix HTML) + name, ellipsized.
  function dashNameCell(name, img, prefixHtml) {
    var wrap = el("div"); wrap.style.cssText = "display:flex;align-items:center;gap:.45rem;min-width:0;";
    wrap.appendChild(dashThumb(img));
    var t = el("span"); t.style.cssText = "min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;";
    t.innerHTML = (prefixHtml || "") + esc(name || "Unnamed");
    wrap.appendChild(t); return wrap;
  }
  // whole = make the entire card a navigation target. Omit it for widgets that hold their
  // own interactive controls (tracks) — there, only the "Open ›" link navigates.
  function widget(title, count, onOpen, whole) {
    var w = el("div", "w" + (onOpen && whole ? " click" : ""));
    var h = el("h3"); h.appendChild(el("span", null, title));
    if (onOpen) {
      var a = el("span", "wlink", "Open ›"); a.style.cursor = "pointer";
      a.onclick = function (ev) { ev.stopPropagation(); onOpen(); };
      h.appendChild(a); if (whole) w.onclick = onOpen;
    } else if (count != null) h.appendChild(el("span", "wlink", String(count)));
    w.appendChild(h); return w;
  }

  function renderDashboard(root) {
    var grid = el("div", "dash");

    // Story Arc(s) — wide tiles. Resolved Stories (won or lost) drop off the board.
    var liveArcs = camp.arcs.filter(function (a) { return !arcDone(a); });
    if (!liveArcs.length) {
      var aw = widget("Story Arc", null, function () { jump("arcs"); }, true);
      aw.appendChild(dashEmpty(camp.arcs.length ? "No Story in progress — tap to start one." : "No Story Arc yet — tap to add one."));
      grid.appendChild(aw);
    } else {
      liveArcs.forEach(function (a) { grid.appendChild(dashArc(a)); });
    }

    // Heroes — one tile each, so a small party doesn't hog a full-width row.
    if (!camp.heroes.length) { var hw = widget("Heroes", 0, null); hw.appendChild(dashEmpty("No heroes yet.")); grid.appendChild(hw); }
    else camp.heroes.forEach(function (h) { grid.appendChild(dashHero(h)); });

    // Challenges + reference tables — wide tiles that fill in beside the heroes.
    grid.appendChild(dashChallenges());
    grid.appendChild(dashCast());
    grid.appendChild(dashPlaces());

    root.appendChild(grid);
  }

  // A Story is resolved once the Hero Track fills (won) or the Antagonist Track fills (lost).
  function arcDone(a) { var sz = SIZES[a.size]; return a.arc >= sz.ms || a.anta >= sz.anta; }

  function dashArc(a) {
    var sz = SIZES[a.size];
    var w = widget("Story Arc", null, function () { jump("arcs"); });
    var goal = el("div"); goal.style.cssText = "font-weight:800;font-size:1rem;line-height:1.25;";
    goal.textContent = a.goal || "Untitled Story Arc"; w.appendChild(goal);
    var sub = el("div"); sub.style.cssText = "font-size:.75rem;color:var(--muted);margin:.1rem 0 .55rem;";
    sub.textContent = sz.label + " · " + a.arc + " of " + sz.ms + " Milestones";
    w.appendChild(sub);
    w.appendChild(dashTrack("Hero", a.arc, sz.ms, "var(--good)", function (n) { a.arc = n; persist(); render(); }));
    w.appendChild(dashTrack("Antagonist", a.anta, sz.anta, "var(--bad)", function (n) { a.anta = n; persist(); render(); }));
    if (a.antaName || a.antaWants) {
      var an = el("div"); an.style.cssText = "font-size:.78rem;margin-top:.5rem;";
      an.innerHTML = "<b>" + esc(a.antaName || "Antagonist") + "</b>" + (a.antaWants ? ' <span style="color:var(--muted)">— ' + esc(a.antaWants) + "</span>" : "");
      w.appendChild(an);
    }
    return w;
  }
  function dashTrack(label, cur, max, color, onSet) {
    var r = el("div"); r.style.cssText = "display:flex;align-items:center;gap:.5rem;margin:.28rem 0;";
    var l = el("span"); l.style.cssText = "font-size:.7rem;font-weight:700;color:var(--muted);width:5rem;flex:0 0 auto;"; l.textContent = label;
    var v = el("span"); v.style.cssText = "font-size:.72rem;font-weight:800;width:2.4rem;text-align:right;flex:0 0 auto;"; v.textContent = cur + " / " + max;
    r.appendChild(l); r.appendChild(segTrack(cur, max, color, onSet)); r.appendChild(v); return r;
  }

  function dashHero(h) {
    var c = el("div", "hc"); c.onclick = function () { jump("heroes", h.id); };
    var top = el("div", "hc-top");
    if (h.img) { var av = el("img", "hc-av"); av.src = h.img; av.alt = ""; av.title = "View photo"; av.style.cursor = "zoom-in"; av.onclick = function (ev) { ev.stopPropagation(); viewImage(h.img); }; top.appendChild(av); }

    var live = camp.challenges.filter(function (c) { return c.current < c.max; });
    var w = widget("Challenges", live.length, function () { jump("challenges"); });
    if (!live.length) { w.appendChild(dashEmpty("No active Challenges.")); return w; }

      row.appendChild(top);

    b2.appendChild(el("h3", null, "Shared game (live)"));
    if (online) {
      var st = el("div", "status"); st.innerHTML = '<span class="dot" style="background:var(--good)"></span> Live · game <b>' + online.code + "</b>"; b2.appendChild(st);
      b2.appendChild(el("p", "hint", "Anyone with the invite link sees this campaign update live. The same link rejoins next session."));
      var r2 = el("div", "row");
      var cp = el("button", "sm", "Copy invite link"); cp.onclick = function () { copy(inviteLink()).then(function (ok) { toast(ok ? "Invite link copied!" : inviteLink()); }); };
      var lv = el("button", "ghost sm", "Go offline"); lv.onclick = leaveOnline;
      r2.appendChild(cp); r2.appendChild(lv); b2.appendChild(r2);
    } else {
      b2.appendChild(el("p", "hint", "Put this campaign online so your whole table sees it update live — no accounts, just share the link."));
      var go2 = el("button", "sm", "Start shared game"); go2.style.width = "100%"; go2.onclick = goOnline; b2.appendChild(go2);
    }
    root.appendChild(b2);

    // --- This campaign ---
    var b3 = el("div", "mblock");
    b3.appendChild(el("h3", null, "This campaign"));
    b3.appendChild(el("p", "hint", "A backup link carries the whole campaign exactly as it looks now — paste it somewhere safe in case this browser is cleared."));
    var r3 = el("div", "row");
    var sh = el("button", "ghost sm", "Copy backup link"); sh.onclick = shareLink;
    var pr = el("button", "ghost sm", "Print"); pr.onclick = function () { window.print(); };
    r3.appendChild(sh); r3.appendChild(pr); b3.appendChild(r3);
    var del = el("button", "danger sm", "Delete this campaign"); del.style.cssText = "margin-top:.6rem;width:100%;"; del.onclick = deleteCampaign;
    b3.appendChild(del);
    root.appendChild(b3);
  }

  // ---------- track widget ----------
  // tapping the topmost filled box clears it (down one); tapping any other sets to that value.
  function trackRow(label, cls, count, value, onSet, opts) {
    opts = opts || {};
    var t = el("div", "track " + cls);
    for (var i = 1; i <= count; i++) {
      (function (n) {
        var b = el("span", "box");
        var filled = n <= value;
        if (filled) b.classList.add("fill");
        if (opts.start && n === opts.start) b.classList.add("start");
        if (opts.climax && n === opts.climax) { b.classList.add("climax"); b.textContent = "★"; }
        else if (opts.closein && n % 2 === 1) { b.classList.add("closein"); b.textContent = "▲"; }
        else if (opts.labels) b.textContent = n;
        b.onclick = function () { onSet(value === n ? n - 1 : n); };
        t.appendChild(b);
      })(i);
    }
    return t;
  }
  function readout(pre, val, post) { var p = el("p", "readout"); p.innerHTML = pre + "<span>" + val + "</span>" + (post ? '<small>' + post + "</small>" : ""); return p; }

  // ---------- actions ----------
  function newCampaign() {
    var name = prompt("Name your campaign:", "Our Campaign");
    if (name === null) { if (!camp && !camps.length) render(); return; }
    camp = blankCampaign(name.trim() || "New Campaign"); isImport = false; ui = { tab: "heroes", openHero: null, openArc: null };
    history.replaceState(null, "", location.pathname + location.search);
    persist(); render();
  }
  function loadCampaign(id) {
    var c = camps.find(function (x) { return x.id === id; }); if (!c) return;
    camp = c; isImport = false; ui = { tab: "dashboard", openHero: null, openArc: null };
    try { localStorage.setItem(LS_ACTIVE, id); } catch (e) {}
    render();
  }
  function shareLink() {
    if (!camp) return;
    var url = location.origin + location.pathname + "#c=" + encode();
    copy(url).then(function (ok) {
      toast(ok ? "Backup link copied — paste it somewhere safe." : "Couldn't copy — try again.");
      if (!online) history.replaceState(null, "", url); // don't clobber a live #g= link
    });
  }
  function copy(text) {
    if (navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(text).then(function () { return true; }, function () { return false; });
    try { var ta = el("textarea"); ta.value = text; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select();
      var ok = document.execCommand("copy"); document.body.removeChild(ta); return Promise.resolve(ok); } catch (e) { return Promise.resolve(false); }
  }
  function importSave() {
    isImport = false;
    if (!camps.some(function (c) { return c.id === camp.id; })) camps.push(camp);
    saveAll(); try { localStorage.setItem(LS_ACTIVE, camp.id); } catch (e) {}
    history.replaceState(null, "", location.pathname + location.search);
    render(); toast("Saved to this device.");
  }
  function deleteCampaign() {
    if (isImport) { toast("Nothing to delete — this one isn't saved here."); return; }
    if (!camp) return;
    confirmDel("Delete campaign \"" + (camp.name || "") + "\" from this device? This can't be undone.", function () {
      camps = camps.filter(function (c) { return c.id !== camp.id; }); saveAll();
      camp = camps[camps.length - 1] || null;
      try { localStorage.setItem(LS_ACTIVE, camp ? camp.id : ""); } catch (e) {}
      render(); toast("Deleted.");
    });
  }
  function confirmDel(msg, fn) { if (confirm(msg)) fn(); }

  var toastTimer;
  function toast(msg) { var t = $("toast"); t.textContent = msg; t.classList.add("show"); clearTimeout(toastTimer); toastTimer = setTimeout(function () { t.classList.remove("show"); }, 2200); }

  // ---------- init ----------
  function init() {
    $("menuBtn").innerHTML = icon("menu");
    $("menuBtn").onclick = openDrawer;
    $("drawerOverlay").onclick = closeDrawer;
    document.addEventListener("keydown", function (e) { if (e.key === "Escape") closeDrawer(); });
    var nameIn = $("campName");
    nameIn.oninput = function () { if (camp) { camp.name = nameIn.value; persist(); } };
    // When the user stops typing, apply any remote update we deferred so we never yanked
    // the DOM out from under a focused field.
    document.addEventListener("focusout", function () { setTimeout(flushPendingRemote, 60); });

    var gm = (location.hash || "").match(/[#&]g=([^&]+)/);
    if (gm) { setStatus("syncing"); render(); joinGame(gm[1]); return; }
    var m = (location.hash || "").match(/[#&]c=([^&]+)/);
    if (m) { try { camp = decode(m[1]); isImport = true; } catch (e) { camp = null; } }
    if (!camp) {
      var activeId = null; try { activeId = localStorage.getItem(LS_ACTIVE); } catch (e) {}
      camp = (activeId && camps.find(function (c) { return c.id === activeId; })) || camps[camps.length - 1] || null;
      isImport = false;
    }
    render();
  }
  if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init); else init();
})();
</script>
</body>
</html>
