site_name: Amazing Forge
site_description: A cinematic, zero-prep tabletop RPG for ages 10+.
site_url: https://ian-hitt.github.io/amazing-forge/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: deep orange
      accent: amber
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - pymdownx.tabbed:
      alternate_style: true
  - attr_list
  - md_in_html
  - tables
  - footnotes
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: index.md
  - Foreword: foreword.md
  - Part One — Your First Game:
      - 1. Build Your World: part-one/01-build-your-world.md
      - 2. Create Your Hero: part-one/02-create-your-hero.md
      - 3. Start Your Quest: part-one/03-start-your-quest.md
      - 4. The Roll: part-one/04-the-roll.md
      - 5. Playing the Game: part-one/05-playing-the-game.md
      - 6. Your First Session: part-one/06-your-first-session.md
  - Part Two — Playing the Game, In Depth:
      - 7. The Roll: part-two/07-the-roll.md
      - 8. Challenges: part-two/08-challenges.md
      - 9. Readiness: part-two/09-readiness.md
      - 10. Quests & the Antagonist Track: part-two/10-quests-and-the-antagonist-track.md
      - 11. Ask the Oracle: part-two/11-ask-the-oracle.md
      - 12. Running the Game: part-two/12-running-the-game.md
      - 13. Growing Your Heroes: part-two/13-growing-your-heroes.md
  - Part Three — Building Your World:
      - 14. The World Forge: part-three/14-the-world-forge.md
      - 15. Genres:
          - Overview: part-three/15-genres.md
          - Adventure: part-three/genres/adventure.md
          - Mystery: part-three/genres/mystery.md
          - Horror: part-three/genres/horror.md
          - Sci-Fi: part-three/genres/sci-fi.md
          - Caper: part-three/genres/caper.md
          - Drama: part-three/genres/drama.md
      - 16. Building a Cool Hero: part-three/16-cool-characters.md
  - Part Four — Reference & Tools:
      - Moves Cheatsheet: part-four/moves-cheatsheet.md
      - Hero Sheet: part-four/hero-sheet.md
      - Quest Tracker Sheet: part-four/quest-tracker-sheet.md
      - World Forge Worksheet: part-four/world-forge-worksheet.md
      - The Story Engine: part-four/the-story-engine.md
      - Three-Act Structure: part-four/three-act-structure.md
      - The Beat Sheet: part-four/beat-sheet.md
      - Teaching the Game: part-four/teaching-the-game.md
      - Design Notes: part-four/design-notes.md
