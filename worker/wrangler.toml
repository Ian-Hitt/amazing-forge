name = "lca-campaign"
main = "src/worker.js"
compatibility_date = "2026-01-01"

# Each shared campaign is stored in this KV namespace, keyed by its game code.
# The `id` below is filled in automatically by:  npx wrangler kv namespace create CAMPAIGNS
[[kv_namespaces]]
binding = "CAMPAIGNS"
id = "639347d47b764b0aa900b9abcd254470"

# Uploaded portraits/photos (heroes, places, cast) live in R2 object storage, not KV —
# the synced campaign JSON only ever carries the short image URL. Create the bucket with:
#   npx wrangler r2 bucket create lca-campaign-images
[[r2_buckets]]
binding = "IMAGES"
bucket_name = "lca-campaign-images"
